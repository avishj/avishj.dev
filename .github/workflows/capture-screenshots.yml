name: Refresh project screenshots

on:
  schedule:
    - cron: '0 3 * * 0' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.1.2

      - name: Install dependencies
        run: bun install

      - name: Install pageres-cli
        run: bun install -g pageres-cli

      - name: Capture active project screenshots
        run: bun run scripts/capture-projects.ts --active-only

      - name: Commit & push updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/projects/
          git diff --staged --quiet && echo "No changes to commit" || (git commit -m "ci: refresh active project screenshots" && git push)
