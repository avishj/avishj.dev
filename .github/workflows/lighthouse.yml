name: Lighthouse Audit

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:
  push:
    branches:
      - v2

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.1.2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview &
          for i in {1..30}; do
            curl -sf http://localhost:4321 > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4321 > /dev/null || exit 1

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12.6.1
        with:
          urls: |
            http://localhost:4321/
            http://localhost:4321/blog
            http://localhost:4321/research
            http://localhost:4321/blog/hello-world
            http://localhost:4321/research/eeg-feature-extraction
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: .github/lighthouse/lighthouserc.json

      - name: Compare results
        run: bun run .github/scripts/lh-compare.js ${{ steps.lighthouse.outputs.resultsPath }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Commit history
        run: |
          git config --global user.email "avish.j@protonmail.com"
          git config --global user.name "Avish"
          git add .lighthouse/history.json
          git diff --staged --quiet || git commit -m "ci: update lighthouse history" -s
          git push
